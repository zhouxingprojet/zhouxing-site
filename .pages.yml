media:
  - name: product_images
    label: 商品封面 / Product images
    input: assets/products
    output: /assets/products
    extensions: [jpg, jpeg, png, webp]
    rename: safe


content:
  - name: products
    label: 商品 / Products
    type: file
    path: data/products.json
    format: json
    list: true
    fields:
      - name: id
        label: 商品编号
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
      - name: order
        label: 排序
        type: number
        required: true
        options:
          min: 1
          max: 999
      - name: published
        label: 在网站显示
        type: boolean
