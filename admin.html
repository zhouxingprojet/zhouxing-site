<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>后台管理 — Xing Zhou</title>
  <meta name="description" content="Xing Zhou 网站与商城管理入口。">
  <link rel="stylesheet" href="styles.css?v=admin-1">
  <link rel="stylesheet" href="admin.css?v=1">

<body class="admin-body">
  <main class="admin-page">
    <header class="admin-header">
      <a class="admin-brand" href="index.html"><img src="logo.png" alt=""><span>Xing Zhou</span></a>
      <a class="admin-back" href="index.html">返回网站 ↗</a>
    </header>

    <section class="admin-intro">
      <p class="eyebrow">Administration</p>
      <h1>后台管理</h1>
      <p>商品内容与付款订单由两个安全后台分别管理。登录验证由 GitHub 和 Stripe 完成，本页面不保存密码。</p>
    </section>

    <section class="admin-links" aria-label="管理工具">
      <a class="admin-card" href="https://app.pagescms.org/zhouxingprojet/zhouxing-site/main/file/products" target="_blank" rel="noopener">
        <span class="admin-number">01</span>
        <span class="admin-card-copy"><strong>网站与商品</strong><small>图片、名称、介绍、价格、销售状态和付款链接</small></span>
        <span class="admin-arrow">↗</span>
      </a>
      <a class="admin-card" href="https://dashboard.stripe.com/" target="_blank" rel="noopener">
        <span class="admin-number">02</span>
        <span class="admin-card-copy"><strong>客户与订单</strong><small>付款、客户资料、订单、退款和 Payment Links</small></span>
        <span class="admin-arrow">↗</span>
      </a>
      <a class="admin-card" href="https://github.com/zhouxingprojet/zhouxing-site" target="_blank" rel="noopener">
        <span class="admin-number">03</span>
        <span class="admin-card-copy"><strong>网站文件</strong><small>GitHub 仓库、版本记录和部署状态</small></span>
        <span class="admin-arrow">↗</span>
      </a>
    </section>

    <p class="admin-note">请勿向任何人透露 GitHub 或 Stripe 密码及验证码。</p>
  </main>
