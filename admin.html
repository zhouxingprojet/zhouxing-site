<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>统一后台管理 — Xing Zhou</title>
  <meta name="description" content="Xing Zhou 官网、文章与商城统一管理入口。">
  <link rel="stylesheet" href="styles.css?v=admin-1">
  <link rel="stylesheet" href="admin.css?v=1">
</head>
<body class="admin-body">
  <main class="admin-page">
    <header class="admin-header">
      <a class="admin-brand" href="index.html"><img src="logo.png" alt=""><span>Xing Zhou</span></a>
      <a class="admin-back" href="index.html">返回网站 ↗</a>
    </header>

    <section class="admin-intro">
      <p class="eyebrow">Administration</p>
      <h1>统一后台管理</h1>
      <p>从这里统一管理 X-ART Lab 文章、商店商品、客户订单和官网文件。各项登录验证由对应的安全后台完成，本页面不保存密码。</p>
    </section>

    <section class="admin-links" aria-label="管理工具">
      <a class="admin-card" href="https://x-art-lab.pages.dev/admin" target="_blank" rel="noopener">
        <span class="admin-number">01</span>
        <span class="admin-card-copy"><strong>文章发布</strong><small>添加、编辑和删除 X-ART Lab 的法语、英语及中文文章</small></span>
        <span class="admin-arrow">↗</span>
      </a>
      <a class="admin-card" href="https://app.pagescms.org/zhouxingprojet/zhouxing-site/main/file/products" target="_blank" rel="noopener">
        <span class="admin-number">02</span>
        <span class="admin-card-copy"><strong>网站与商店商品</strong><small>图片、名称、介绍、价格、销售状态和付款链接</small></span>
        <span class="admin-arrow">↗</span>
      </a>
      <a class="admin-card" href="https://dashboard.stripe.com/" target="_blank" rel="noopener">
        <span class="admin-number">03</span>
        <span class="admin-card-copy"><strong>客户、订阅与订单</strong><small>付款、订阅、客户资料、订单和退款</small></span>
        <span class="admin-arrow">↗</span>
      </a>
      <a class="admin-card" href="https://github.com/zhouxingprojet/zhouxing-site" target="_blank" rel="noopener">
        <span class="admin-number">04</span>
        <span class="admin-card-copy"><strong>网站文件</strong><small>GitHub 仓库、版本记录和部署状态</small></span>
        <span class="admin-arrow">↗</span>
      </a>
    </section>

    <p class="admin-note">请勿向任何人透露后台、GitHub 或 Stripe 密码及验证码。</p>
  </main>
</body>
</html>
