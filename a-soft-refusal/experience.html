<style>.sound-gate{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#07080ce8;backdrop-filter:blur(16px);transition:opacity 1.2s ease,visibility 1.2s}.sound-gate.hidden{opacity:0;visibility:hidden}.enter{display:flex;flex-direction:column;align-items:center;gap:16px;border:0;background:transparent;color:#f4f0e8;cursor:pointer}.enter .ring{display:grid;place-items:center;width:104px;height:104px;border:1px solid #e8ff8a99;border-radius:50%;box-shadow:0 0 48px #e8ff8a1f;animation:soundPulse 2.8s ease-in-out infinite;font-size:23px}.enter strong{font:400 22px Georgia,serif}.enter small{font:9px ui-monospace,monospace;letter-spacing:.2em;color:#f4f0e888;text-transform:uppercase}@keyframes soundPulse{50%{transform:scale(1.08);box-shadow:0 0 74px #e8ff8a40}}</style>
<style>:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07080c;color:#f4f0e8;font-family:Arial,Helvetica,sans-serif}canvas{display:block}.hud{position:fixed;inset:0;z-index:2;pointer-events:none;padding:clamp(18px,3vw,42px);display:flex;flex-direction:column;justify-content:space-between}.top{display:flex;justify-content:space-between;align-items:flex-start}.eyebrow{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#f4f0e88c}.title{margin-top:8px;font-family:Georgia,serif;font-size:clamp(20px,2.2vw,34px);font-weight:400;letter-spacing:-.03em}.counter{font:11px ui-monospace,monospace;color:#f4f0e873}.bottom{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:20px}.stage{max-width:370px}.stage h1{font-family:Georgia,serif;font-size:clamp(27px,4vw,58px);font-weight:400;line-height:.9;letter-spacing:-.05em;margin:0 0 12px}.stage p{font-size:11px;line-height:1.5;letter-spacing:.07em;color:#f4f0e894;max-width:290px;margin:0}.instruction{text-align:center;font:10px ui-monospace,monospace;letter-spacing:.13em;color:#f4f0e894;animation:breathe 3s ease-in-out infinite}.progress{justify-self:end;width:min(22vw,180px);height:1px;background:#ffffff2e}.progress i{display:block;height:1px;width:0;background:#e8ff8a;box-shadow:0 0 9px #e8ff8a}.controls{position:fixed;top:50%;right:clamp(14px,2.5vw,38px);transform:translateY(-50%);z-index:4;display:flex;flex-direction:column;gap:9px}.controls button{width:34px;height:34px;border:1px solid #ffffff2e;border-radius:50%;background:#07080c47;color:#f4f0e8;cursor:pointer;backdrop-filter:blur(8px);font:12px ui-monospace,monospace}.controls button:hover,.controls button:focus-visible{border-color:#e8ff8a;outline:none}.grain{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.12;mix-blend-mode:screen;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTu <body><div class="hud"><div class="top"><div><div class="eyebrow">A generative study in six movements</div><div class="title">A Soft Refusal</div></div><div class="counter"><span id="n">01</span> / 06</div></div><div class="bottom"><div class="stage"><h1 id="stage">fragile clarity</h1><p id="copy">Before the image learns what you want, it can still tremble without purpose.</p></div><div class="instruction" id="hint">move to disturb · hold still to remember</div><div class="progress"><i id="bar"></i></div></div></div><nav class="controls" aria-label="Animation controls"><button id="pause" aria-label="Pause animation">Ⅱ</button><button id="restart" aria-label="Restart animation">↺</button><button id="sound" aria-label="Toggle sound">♪</button></nav><div class="grain"></div><script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.min.js"></script><script src="sketch.js?v=touch-2"></script></body></html>
