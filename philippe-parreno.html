<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Philippe Parreno artist archive on Xing Zhou's website.">
  <link rel="canonical" href="https://zhou-xing.com/philippe-parreno.html">
  <title>Philippe Parreno — Artist Archive</title>
  <style>
    :root{color-scheme:light;--ink:#111;--red:#e11919;--paper:#f7f7f4;--line:#d8d8d2}
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
    body{min-height:100vh}
    a{color:inherit}
    .top{display:flex;justify-content:space-between;align-items:center;padding:20px 28px;border-bottom:1px solid var(--ink);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
    .brand{font-weight:700}.brand span{color:var(--red)}
    .back{border-bottom:1px solid currentColor;text-decoration:none}
    .hero{padding:clamp(46px,9vw,112px) clamp(24px,7vw,104px) 48px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(230px,.75fr);gap:48px;align-items:end;border-bottom:1px solid var(--ink)}
    .eyebrow{margin:0 0 18px;color:var(--red);font-size:12px;letter-spacing:.16em;text-transform:uppercase}
    h1{margin:0;max-width:920px;font-size:clamp(48px,10vw,148px);line-height:.88;letter-spacing:-.08em;font-weight:800}
    .intro{margin:0;max-width:360px;font-size:16px;line-height:1.45}
    .stage{margin:24px clamp(16px,4vw,64px) 72px;border:1px solid var(--ink);background:#fff;box-shadow:12px 12px 0 var(--red)}
    .stagebar{display:flex;justify-content:space-between;gap:20px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--ink);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
    .stagebar a{color:var(--red);text-decoration:none;border-bottom:1px solid var(--red);white-space:nowrap}
    iframe{display:block;width:100%;min-height:980px;border:0;background:#fff}
    .foot{display:flex;justify-content:space-between;gap:20px;padding:18px 28px;border-top:1px solid var(--ink);font-size:11px;line-height:1.4}
    @media(max-width:700px){.top{padding:16px 18px}.hero{display:block;padding:52px 20px 34px}.intro{margin-top:34px;font-size:14px}.stage{margin:18px 10px 46px;box-shadow:6px 6px 0 var(--red)}.stagebar{align-items:flex-start;flex-direction:column;gap:10px;padding:12px}.stagebar a{white-space:normal}iframe{min-height:760px}.foot{padding:16px 18px;display:block}.foot span{display:block;margin-top:8px}}
  </style>
</head>
<body>
  <header class="top"><div class="brand">XING <span>ZHOU</span></div><a class="back" href="/">Back to zhou-xing.com</a></header>
  <main>
    <section class="hero">
      <div><p class="eyebrow">Artist archive / 01</p><h1>Philippe<br>Parreno</h1></div>
      <p class="intro">艺术家档案：作品、展览、出版物与研究资料。档案内容由 X-ART Lab 提供，并沿用订阅访问机制。</p>
    </section>
    <section class="stage">
      <div class="stagebar"><span>Philippe Parreno / Archive</span><a href="https://x-art-lab.pages.dev/?tab=archives" target="_blank" rel="noopener">在 X-ART Lab 中打开 ↗</a></div>
      <iframe src="https://x-art-lab.pages.dev/?tab=archives" title="Philippe Parreno Artist Archive" loading="eager" allow="fullscreen"></iframe>
    </section>
  </main>
  <footer class="foot"><span>zhou-xing.com / artist archive</span><span>Philippe Parreno · X-ART Lab</span></footer>
</body>
</html>
